name = "rapid-dawn-3639"
main = "worker/index.ts"
compatibility_date = "2026-11-05"
workers_dev = true
keep_vars = true

# The existing custom domain can remain attached to this Worker in Cloudflare.
# Do not put account tokens or Supabase secret keys in this file.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
